name: Deploy Next.js site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    # GitHub schedules use UTC. Avoid the top of the hour, when scheduled runs are most likely to queue.
    - cron: "23 7 * * *"

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Refresh and validate public Scryfall catalog
        run: node preview/tools/refresh-card-catalog.cjs

      - name: Test catalog filters and refresh guards
        run: node tests/regression/card-library-search.cjs && node tests/regression/card-catalog-refresh.cjs

      - name: Test hardening contracts
        run: node tests/regression/hardening-contracts.cjs

      # Restore the last validated daily snapshot, not just the older checked-in baseline.
      - name: Restore last known good precon catalog
        uses: actions/cache/restore@v4
        with:
          path: preview/public/precon-data
          key: precon-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: precon-v1-

      - name: Refresh and validate Commander precon catalog
        run: node preview/tools/refresh-precon-catalog.cjs

      - name: Test Commander precon refresh guards
        run: node tests/regression/precon-catalog-refresh.cjs

      - name: Resolve validated Commander display artwork
        run: node preview/tools/refresh-commander-art.cjs && node tests/regression/precon-commander-art.cjs

      - name: Preserve validated precon catalog
        uses: actions/cache/save@v4
        with:
          path: preview/public/precon-data
          key: precon-v1-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Restore last known good Commander combo archive
        uses: actions/cache/restore@v4
        with:
          path: preview/public/combo-data
          key: combos-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: combos-v1-

      - name: Refresh and validate Commander combo archive
        run: node preview/tools/refresh-commander-combos.cjs

      - name: Test Commander combo rules and ownership
        run: node tests/regression/commander-combos.cjs

      - name: Test read-only Commander Swap analysis and legality
        run: node tests/regression/commander-swap.cjs

      - name: Preserve validated Commander combo archive
        uses: actions/cache/save@v4
        with:
          path: preview/public/combo-data
          key: combos-v1-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Build static site
        env:
          DECK_SAGE_SUPABASE_URL: https://mihmykgxbneuhlcxolzm.supabase.co
          DECK_SAGE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_1hELHRe2Zw2LHxNATIgqzQ_ky_La8_S
          DECK_SAGE_SECURE_ACCOUNTS_READY: "true"
          DECK_SAGE_TURNSTILE_SITE_KEY: 0x4AAAAAAFlK4k01uP8hAbK6
        run: npm run build

      - name: Verify public SEO export and affiliate configuration
        run: node tests/regression/seo-public.cjs && node tests/regression/affiliate-links.cjs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
